services:
  - type: web
    name: urbanpro-packer-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_WEB3FORMS_ACCESS_KEY
        value: 89cd421e-088f-474c-b569-a063e5af2aed
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_RECIPIENT_PHONE
        value: "918093017400"
      - key: META_WHATSAPP_TEMPLATE_NAME
        value: urbanpro_new_enquiry
      - key: META_WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: META_WHATSAPP_GRAPH_VERSION
        value: v22.0
